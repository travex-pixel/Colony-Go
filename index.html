<html lang="en">
<head>

<title>Mochi Colony</title>
<style>
:root{
  --cream:#fbf4e6; --parchment:#f6ecd8; --parchment-deep:#ecdcc0;
  --sage:#b9cfa9; --moss:#8fae87; --moss-deep:#6f8f6a;
  --blue:#c5dcec; --peach:#f8d4bd; --pink:#f4c4cf; --lavender:#d9cfe9;
  --butter:#f7e3a1; --terracotta:#d08a6c;
  --brown:#5e4334; --brown-soft:#8a6a55; --brown-line:rgba(94,67,52,.55);
  --shadow:0 6px 18px rgba(94,67,52,.18), 0 1px 2px rgba(94,67,52,.12);
  --font:"Quicksand","Nunito","Avenir Next Rounded","Varela Round","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --grain:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:#efe4cf; color:var(--brown); font-family:var(--font);
  overflow:hidden; position:fixed; inset:0; width:100%;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none; touch-action:manipulation;
}
button{font-family:inherit;}
#app{position:fixed; inset:0; overflow:hidden;}
canvas{display:block;}
#bg,#ambient{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
/* ---------- screens ---------- */
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; visibility:hidden; transform:translateY(10px) scale(.995);
  transition:opacity .38s ease, transform .38s ease, visibility 0s linear .38s;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
}
.screen.active{opacity:1; visibility:visible; transform:none; transition:opacity .42s ease, transform .42s ease, visibility 0s;}
/* ---------- buttons ---------- */
.btn{
  position:relative; appearance:none; border:0; cursor:pointer;
  padding:14px 30px; min-height:54px; border-radius:30px;
  font-size:18px; font-weight:700; letter-spacing:.3px; color:var(--brown);
  background:linear-gradient(180deg,#fdf6e8 0%,#f3e5cb 100%);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.8), inset 0 -2px 0 rgba(94,67,52,.08);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
}
.btn::after{content:""; position:absolute; inset:0; border-radius:inherit; background-image:var(--grain); opacity:.35; mix-blend-mode:multiply; pointer-events:none;}
.btn:active,.btn.pressed{transform:translateY(2px) scale(.97); box-shadow:0 2px 6px rgba(94,67,52,.16), inset 0 1px 0 rgba(255,255,255,.6); filter:brightness(.97);}
.btn:focus-visible{outline:3px solid rgba(143,174,135,.7); outline-offset:3px;}
.btn-primary{
  color:#fff8ee; background:linear-gradient(180deg,#a9c49c 0%,#86a67e 100%);
  text-shadow:0 1px 0 rgba(94,67,52,.25);
  box-shadow:0 8px 22px rgba(111,143,106,.35), 0 1px 2px rgba(94,67,52,.15), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(94,67,52,.12);
  padding:16px 44px; font-size:21px; min-height:60px;
}
.btn-soft{background:linear-gradient(180deg,#fbf1e2 0%,#efdfc4 100%); font-size:16px; padding:12px 22px; min-height:48px;}
.icon-btn{
  width:52px; height:52px; min-height:52px; padding:0; border-radius:50%;
  font-size:22px; line-height:1; flex:0 0 auto;
}
.icon-btn svg{width:26px; height:26px; display:block;}
.icon-btn[aria-pressed="false"]{opacity:.62; filter:saturate(.6);}
.btn[disabled]{opacity:.45; pointer-events:none; filter:saturate(.4);}
.btn-label{font-size:12px; font-weight:700; text-align:center; margin-top:6px; color:var(--brown-soft); letter-spacing:.4px;}
.ctrl{display:flex; flex-direction:column; align-items:center;}
/* ---------- title ---------- */
#screen-title{align-items:center; justify-content:space-between; text-align:center; padding-left:12px; padding-right:12px;}
.title-top{display:flex; width:100%; justify-content:flex-end; gap:10px; padding:12px 4px 0;}
.title-art{display:flex; flex-direction:column; align-items:center; margin-top:min(2vh,14px);}
.title-art svg{width:min(88vw,460px); height:auto; filter:drop-shadow(0 10px 18px rgba(94,67,52,.18));}
.tagline{margin:6px 0 0; font-size:clamp(15px,4.2vw,19px); font-weight:600; color:var(--brown-soft); max-width:30ch;}
#garden-wrap{position:relative; flex:1; width:100%; max-width:600px; min-height:160px; margin:2px auto 0; touch-action:none;}
#parade{position:absolute; inset:0; cursor:pointer; touch-action:none;}
.garden-tip{margin:0 auto 8px; line-height:1.3; font-size:14px; font-weight:800; color:var(--brown); background:rgba(251,244,230,.82); padding:6px 14px; border-radius:14px; box-shadow:0 2px 8px rgba(94,67,52,.1); max-width:92%; text-align:center; min-height:20px;}
.mode-row{display:flex; gap:12px; justify-content:center; width:100%; max-width:420px;}
.mode-btn{flex:1; min-width:0; padding:10px 14px 10px 10px; font-size:19px; gap:8px; justify-content:center;}
.mode-btn canvas{width:44px; height:40px; flex:0 0 auto;}
.mode-btn.alt{background:linear-gradient(180deg,#f0b48f 0%,#d98d68 100%); box-shadow:0 8px 22px rgba(208,138,108,.35), 0 1px 2px rgba(94,67,52,.15), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(94,67,52,.12);}
.tabs{display:flex; gap:8px; justify-content:center; padding:4px 16px 2px;}
.tabs button{appearance:none; border:0; cursor:pointer; font:inherit; font-weight:800; font-size:15px; color:var(--brown-soft); padding:9px 20px; border-radius:18px; background:rgba(251,244,230,.6); box-shadow:0 2px 6px rgba(94,67,52,.1);}
.tabs button.on{background:linear-gradient(180deg,#fdf6e8,#f1e2c6); color:var(--brown); box-shadow:var(--shadow);}
.btn.nudge{animation:nudge 1s ease-in-out infinite;}
@keyframes nudge{0%,100%{transform:none} 50%{transform:translateY(-4px) scale(1.06)}}
.row-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.progress-pill.streak{color:var(--moss-deep); background:rgba(169,201,154,.35);}
.progress-pill[hidden]{display:none;}
.daily-card{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px auto 18px; max-width:520px; padding:14px 18px; border-radius:22px; background:linear-gradient(180deg,#fdf6e8,#f1e2c6); box-shadow:var(--shadow); border:0; width:100%; cursor:pointer; color:var(--brown); text-align:left;}
.daily-card b{display:block; font-size:17px; font-weight:800;}
.daily-card span{font-size:13px; font-weight:700; color:var(--brown-soft);}
.daily-card .stars{display:flex; gap:2px;} .daily-card .stars svg{width:18px; height:18px;}
.hud-right .tiles{font-size:11px; font-weight:800; color:var(--moss-deep);}
.title-actions{display:flex; flex-direction:column; align-items:center; gap:14px; padding-bottom:max(18px,env(safe-area-inset-bottom)); width:100%;}
.progress-pill{
  display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--brown-soft);
  background:rgba(251,244,230,.75); padding:7px 14px; border-radius:20px; box-shadow:0 2px 8px rgba(94,67,52,.1);
}
.progress-pill .bar{width:120px; height:8px; border-radius:6px; background:rgba(94,67,52,.12); overflow:hidden;}
.progress-pill .bar i{display:block; height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,var(--moss),var(--sage)); transition:width .6s ease;}
/* ---------- level select ---------- */
#screen-levels{padding-left:0; padding-right:0;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px 6px;}
.topbar h2{margin:0; font-size:22px; font-weight:800; letter-spacing:.3px; text-shadow:0 1px 0 rgba(255,255,255,.6);}
.topbar .spacer{width:52px;}
.levels-scroll{flex:1; overflow-y:auto; overflow-x:hidden; padding:6px 16px 28px; -webkit-overflow-scrolling:touch; touch-action:pan-y;}
.area{margin:10px auto 22px; max-width:520px;}
.area-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 4px 10px;}
.area-head h3{margin:0; font-size:19px; font-weight:800;}
.area-head span{font-size:13px; font-weight:700; color:var(--brown-soft);}
.area.locked .area-head h3{opacity:.55;}
.level-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
@media (min-width:420px){.level-grid{grid-template-columns:repeat(4,1fr); gap:14px;}}
.level-card{
  position:relative; aspect-ratio:1/1.08; border-radius:22px; border:0; cursor:pointer; padding:0;
  background:linear-gradient(180deg,#fdf6e8,#f1e2c6); box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.8);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--brown);
  transition:transform .12s ease, box-shadow .12s ease;
}
.level-card::after{content:""; position:absolute; inset:0; border-radius:inherit; background-image:var(--grain); opacity:.35; mix-blend-mode:multiply; pointer-events:none;}
.level-card:active{transform:translateY(2px) scale(.96);}
.level-card .num{font-size:26px; font-weight:800; line-height:1;}
.level-card .stars{display:flex; gap:2px; height:16px;}
.level-card .stars svg{width:15px; height:15px;}
.level-card.locked{background:linear-gradient(180deg,#efe6d6,#e3d6bf); color:rgba(94,67,52,.45); box-shadow:0 2px 6px rgba(94,67,52,.08); cursor:default;}
.level-card.locked .num{font-size:20px;}
.level-card.current{box-shadow:0 0 0 3px rgba(143,174,135,.75), var(--shadow);}
.level-card .dot{position:absolute; top:8px; right:8px; width:10px; height:10px; border-radius:50%; background:var(--moss);}
/* ---------- game ---------- */
#screen-game{padding-left:0; padding-right:0;}
.hud{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px 4px; min-height:66px;}
.hud-center{flex:1; text-align:center; min-width:0;}
.hud-center .lvl{font-size:12px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--brown-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hud-center .name{font-size:19px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 0 rgba(255,255,255,.6);}
.hud-right{display:flex; flex-direction:column; align-items:flex-end; gap:4px; min-width:52px;}
.pips{display:flex; gap:5px;}
.pips i{display:block; width:11px; height:11px; border-radius:50%; background:rgba(94,67,52,.15); box-shadow:inset 0 0 0 2px rgba(255,255,255,.35); transition:transform .3s ease, background .3s ease;}
.pips i.on{transform:scale(1.15); box-shadow:0 0 0 2px rgba(255,255,255,.7);}
.hud-right .home-count{font-size:12px; font-weight:800; color:var(--brown-soft);}
#nb-wrap,#board-wrap{flex:1; position:relative; min-height:0; display:flex; align-items:center; justify-content:center; padding:4px 10px; touch-action:none;}
#board{touch-action:none; cursor:pointer; border-radius:26px;}
#nb-hint,#hint-bubble{
  position:absolute; left:50%; bottom:6px; transform:translate(-50%,8px); opacity:0;
  background:rgba(251,244,230,.95); color:var(--brown); font-size:15px; font-weight:700; padding:10px 16px; border-radius:18px;
  box-shadow:var(--shadow); max-width:88%; text-align:center; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
}
#nb-hint.show,#hint-bubble.show{opacity:1; transform:translate(-50%,0);}
.controls{display:flex; justify-content:center; align-items:flex-start; gap:22px; padding:8px 12px 12px; min-height:92px;}
/* ---------- overlay ---------- */
.overlay{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px;
  background:rgba(94,67,52,.22); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
  opacity:0; visibility:hidden; transition:opacity .4s ease, visibility 0s linear .4s;
}
.overlay.show{opacity:1; visibility:visible; transition:opacity .4s ease, visibility 0s;}
.card{
  position:relative; width:min(92vw,400px); padding:28px 22px 24px; border-radius:30px; text-align:center;
  background:linear-gradient(180deg,#fdf7ea,#f3e6cf); box-shadow:0 18px 50px rgba(94,67,52,.3), inset 0 1px 0 rgba(255,255,255,.9);
  transform:translateY(24px) scale(.94); transition:transform .5s cubic-bezier(.2,.9,.3,1.2);
}
.overlay.show .card{transform:none;}
.card::after{content:""; position:absolute; inset:0; border-radius:inherit; background-image:var(--grain); opacity:.4; mix-blend-mode:multiply; pointer-events:none;}
.card > *{position:relative; z-index:1;}
.card h2{margin:4px 0 2px; font-size:30px; font-weight:800; letter-spacing:.2px;}
.card .sub{margin:0 0 14px; color:var(--brown-soft); font-weight:700; font-size:15px;}
.card .stars-big{display:flex; justify-content:center; gap:10px; margin:6px 0 16px; height:54px;}
.card .stars-big svg{width:50px; height:50px; transform:scale(0); transition:transform .45s cubic-bezier(.3,1.6,.5,1);}
.overlay.show .card .stars-big svg.on{transform:scale(1);}
.overlay.show .card .stars-big svg.off{transform:scale(.72); opacity:.35; transition-delay:.3s;}
.card .msg{font-size:15px; color:var(--brown-soft); font-weight:600; margin:0 0 18px; min-height:20px;}
.card .unlock[hidden]{display:none;}
.card .unlock{display:inline-block; background:rgba(143,174,135,.18); color:var(--moss-deep); padding:6px 12px; border-radius:14px; font-size:13px; font-weight:800; margin-bottom:12px;}
.card .actions{display:flex; flex-direction:column; gap:10px; align-items:stretch;}
.card .actions .row{display:flex; gap:10px; justify-content:center;}
#celebrate{position:absolute; inset:0; pointer-events:none;}
#toast{
  position:absolute; left:50%; top:calc(env(safe-area-inset-top) + 84px); transform:translate(-50%,-8px);
  background:rgba(94,67,52,.86); color:#fff6e8; font-weight:700; font-size:14px; padding:9px 16px; border-radius:16px;
  opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none; max-width:86%; text-align:center; z-index:5;
}
#toast.show{opacity:1; transform:translate(-50%,0);}
#nb-intro,#intro{
  position:absolute; left:50%; top:8px; transform:translate(-50%,-14px); opacity:0; pointer-events:none; z-index:4;
  display:flex; align-items:center; gap:12px; padding:10px 16px 10px 10px; max-width:92%;
  background:linear-gradient(180deg,#fdf7ea,#f3e6cf); border-radius:22px; box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);
  transition:opacity .35s ease, transform .35s ease;
}
#nb-intro.show,#intro.show{opacity:1; transform:translate(-50%,0);}
#nb-intro canvas,#intro canvas{width:76px; height:56px; flex:0 0 auto;}
#nb-intro,#intro{width:max-content;}
#nb-intro .txt,#intro .txt{font-size:14px; font-weight:700; color:var(--brown); line-height:1.3;}
#nb-intro .txt b,#intro .txt b{display:block; font-size:16px; font-weight:800;}
#nb-intro .txt span,#intro .txt span{color:var(--brown-soft);}
#toast.action{pointer-events:auto; cursor:pointer; background:linear-gradient(180deg,#86a67e,#6f8f6a); color:#fff8ee;}
.treats-earned{display:inline-flex; align-items:center; gap:8px; margin:0 auto 12px; padding:6px 14px 6px 8px; border-radius:16px; background:rgba(226,180,100,.2); color:#7a5541; font-weight:800; font-size:14px;}
.treats-earned[hidden]{display:none;}
.treats-earned canvas{width:26px; height:26px;}
.card .next-up{font-size:14px; font-weight:800; color:var(--moss-deep); margin:-8px 0 14px;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.reduce-motion *{transition-duration:.01ms !important; animation-duration:.01ms !important;}
@media (max-height:640px){
  .garden-tip{font-size:13px; padding:5px 12px;} .title-actions{gap:10px;}
  .title-art svg{width:min(74vw,340px);} .tagline{font-size:14px;} .btn-primary{padding:13px 38px; min-height:54px; font-size:19px;}
  .controls{min-height:84px;} .hud{min-height:58px;}
}
@media (min-width:900px){ .level-grid{grid-template-columns:repeat(4,1fr);} }
</style>
</head>
<body>
<div id="app">
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="ambient" aria-hidden="true"></canvas>

  <!-- ===== TITLE ===== -->
  <section id="screen-title" class="screen active" aria-label="Title">
    <div class="title-top">
      <button class="btn icon-btn" id="btn-sound" aria-label="Toggle sound" aria-pressed="true" title="Sound"></button>
      <button class="btn icon-btn" id="btn-motion" aria-label="Toggle animations" aria-pressed="true" title="Animations"></button>
    </div>
    <div class="title-art">
      <svg id="logo" viewBox="0 0 460 190" role="img" aria-label="Mochi Colony"></svg>
      <p class="tagline">Help the little forest spirits find their way home.</p>
    </div>
    <div id="garden-wrap"><canvas id="parade" aria-label="The colony garden. Tap a friend to pet them." role="img"></canvas></div>
    <p class="garden-tip" id="garden-tip">Tap Mochi to say hello</p>
    <div class="title-actions">
      <div class="mode-row"><button class="btn btn-primary mode-btn" id="btn-play" aria-label="Play Paths"><canvas width="88" height="80" data-ico="mochi" aria-hidden="true"></canvas><span>Paths</span></button><button class="btn btn-primary mode-btn alt" id="btn-nibble" aria-label="Play Nibbles"><canvas width="88" height="80" data-ico="bunny" aria-hidden="true"></canvas><span>Nibbles</span></button></div>
      <div class="row-btns"><button class="btn btn-soft" id="btn-daily">Today's puzzle</button><button class="btn btn-soft" id="btn-levels">Levels</button></div>
      <div class="progress-pill" id="title-progress"><span>Colony</span><span class="bar"><i></i></span><span class="pct">0%</span></div>
      <div class="progress-pill streak" id="title-streak" hidden></div>
    </div>
  </section>

  <!-- ===== LEVEL SELECT ===== -->
  <section id="screen-levels" class="screen" aria-label="Level select">
    <div class="topbar">
      <button class="btn icon-btn" id="btn-levels-back" aria-label="Back to title"></button>
      <h2>The Colony Map</h2>
      <div class="spacer"></div>
    </div>
    <div class="tabs" role="tablist"><button data-m="path" class="on" role="tab">Paths</button><button data-m="nibble" role="tab">Nibbles</button></div>
    <div class="levels-scroll" id="levels-scroll"></div>
  </section>

  <!-- ===== GAME ===== -->
  <section id="screen-game" class="screen" aria-label="Puzzle">
    <header class="hud">
      <button class="btn icon-btn" id="btn-menu" aria-label="Back to levels"></button>
      <div class="hud-center"><div class="lvl" id="hud-level">Level 1</div><div class="name" id="hud-name">Hello, Mochi</div></div>
      <div class="hud-right"><div class="pips" id="pips"></div><div class="home-count" id="home-count">0 / 1 home</div><div class="tiles" id="hud-tiles" hidden></div></div>
    </header>
    <div id="board-wrap">
      <canvas id="board" aria-label="Puzzle board"></canvas>
      <div id="hint-bubble" role="status"></div>
      <div id="intro" role="status" aria-live="polite"><canvas width="152" height="112" aria-hidden="true"></canvas><div class="txt"></div></div>
    </div>
    <footer class="controls">
      <div class="ctrl"><button class="btn icon-btn" id="btn-undo" aria-label="Undo last path"></button><div class="btn-label">Undo</div></div>
      <div class="ctrl"><button class="btn icon-btn" id="btn-hint" aria-label="Show a hint"></button><div class="btn-label">Hint</div></div>
      <div class="ctrl"><button class="btn icon-btn" id="btn-reset" aria-label="Reset level"></button><div class="btn-label">Reset</div></div>
    </footer>
  </section>

  <!-- ===== NIBBLES ===== -->
  <section id="screen-nibble" class="screen" aria-label="Nibble puzzle">
    <header class="hud">
      <button class="btn icon-btn" id="nb-menu" aria-label="Back to levels"></button>
      <div class="hud-center"><div class="lvl" id="nb-level">Nibbles 1</div><div class="name" id="nb-name">First Nibble</div></div>
      <div class="hud-right"><div class="home-count" id="nb-left"></div></div>

<script>
'use strict';
/* =====================================================================
   MOCHI COLONY — a cosy hand-painted path puzzle
   Sections: utils · audio · storage · levels · art (watercolour, scenery,
   ambient, characters, homes) · game model · input · board renderer · UI
   ===================================================================== */

// ----------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const easeInOut = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeBack = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const key = (x, y) => x + ',' + y;
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(h, a) { if (h.startsWith('rgb')) return h; const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function mix(h1, h2, t) { const a = hexToRgb(h1), b = hexToRgb(h2); return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`; }
function shade(h, t) { return mix(h, '#5e4334', t); }   // towards warm brown
function tint(h, t) { return mix(h, '#fffaf0', t); }    // towards cream light
function fitCanvas(cv, w, h) {
  const dpr = clamp(window.devicePixelRatio || 1, 1, 2.5);
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return ctx;
}
function offscreen(w, h) { const c = document.createElement('canvas'); const dpr = clamp(window.devicePixelRatio || 1, 1, 2.5); c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr)); c._w = w; c._h = h; const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return [c, ctx]; }
const now = () => performance.now();

// ----------------------------------------------------------------- audio
const Audio = {
  ctx: null, master: null, enabled: true, lastStep: 0,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.32;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
      this.master.connect(lp); lp.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  tone(f, dur, { type = 'sine', vol = .5, at = 0, attack = .008, release = .12, slide = 0 } = {}) {
    if (!this.enabled || !this.ctx) return;
    const t0 = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f * slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.setValueAtTime(vol, t0 + Math.max(attack, dur - release)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + release);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + release + .02);
  },
  pluck(f, at = 0, vol = .35) { this.tone(f, .09, { type: 'triangle', vol, at, release: .22 }); this.tone(f * 2, .05, { type: 'sine', vol: vol * .25, at, release: .12 }); },
  step(i) { if (!this.enabled) return; const t = now(); if (t - this.lastStep < 45) return; this.lastStep = t; const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5]; this.pluck(scale[i % scale.length], 0, .22); },
  bump() { this.tone(150, .09, { type: 'triangle', vol: .3, release: .08, slide: .6 }); },
  cut() { this.tone(420, .07, { type: 'sine', vol: .2, release: .1, slide: .7 }); },
  connect(combo = 1) { const k = Math.pow(2, Math.min(combo - 1, 6) * 2 / 12); this.pluck(659.25 * k, 0, .35); this.pluck(987.77 * k, .09, .35); this.tone(1318.5 * k, .18, { type: 'sine', vol: .12, at: .18, release: .3 }); if (combo > 1) this.tone(1975.5 * k, .12, { type: 'sine', vol: .08, at: .26, release: .3 }); },
  bloom() { [1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => this.tone(f, .1, { type: 'sine', vol: .1, at: i * .07, release: .35 })); },
  arrive() { this.tone(880, .06, { type: 'sine', vol: .25, release: .15, slide: 1.4 }); this.tone(1760, .05, { type: 'sine', vol: .1, at: .06, release: .2 }); },
  pop() { this.tone(520, .04, { type: 'sine', vol: .2, release: .06, slide: 1.3 }); },
  undo() { this.pluck(523.25, 0, .25); this.pluck(392, .08, .25); },
  tap() { this.tone(620, .035, { type: 'sine', vol: .18, release: .06 }); },
  pet(type) { const base = { mochi: 660, pip: 560, bibi: 740, moss: 440, puddle: 620, bumble: 820 }[type] || 640; this.tone(base, .08, { type: 'sine', vol: .26, release: .1, slide: 1.25 }); this.tone(base * 1.5, .07, { type: 'sine', vol: .14, at: .09, release: .14, slide: 1.12 }); },
  purr() { this.tone(180, .5, { type: 'triangle', vol: .08, attack: .1, release: .3 }); this.tone(1046.5, .1, { type: 'sine', vol: .12, at: .05, release: .2 }); },
  munch() { [0, .14, .28].forEach(a => this.tone(300 + Math.random() * 80, .04, { type: 'triangle', vol: .2, at: a, release: .05, slide: .7 })); this.pluck(880, .45, .25); },
  complete() {
    const n = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    n.forEach((f, i) => this.pluck(f, i * .11, .35));
    [261.63, 329.63, 392].forEach(f => this.tone(f, 1.1, { type: 'sine', vol: .07, at: .25, attack: .3, release: .6 }));
  }
};

// --------------------------------------------------------------- storage
const Save = {
  KEY: 'mochi-colony-save-v1', ok: true,
  data: { stars: {}, sound: true, motion: null, lastLevel: 0, met: {}, daily: { done: {}, streak: 0, last: '' }, perfectStreak: 0, treats: null, pets: {}, petTips: 0, nstars: {}, nLast: 0 },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) { const d = JSON.parse(raw); if (d && typeof d === 'object') Object.assign(this.data, d); } }
    catch (e) { this.ok = false; }
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { this.ok = false; } },
  stars(i) { return this.data.stars[i] || 0; },
  setStars(i, n) { const prev = this.stars(i); if (n > prev) { this.data.stars[i] = n; this.data.treats = (this.data.treats || 0) + (n - prev); this.save(); } },
  nStars(i) { return (this.data.nstars || {})[i] || 0; },
  setNStars(i, n) { this.data.nstars = this.data.nstars || {}; const prev = this.nStars(i); if (n > prev) { this.data.nstars[i] = n; this.data.treats = (this.data.treats || 0) + (n - prev); } this.save(); },
  nUnlocked() { let n = 1; for (let i = 0; i < NLEVELS.length; i++) if (this.nStars(i) > 0) n = Math.max(n, i + 2); return Math.min(n, NLEVELS.length); },
  nTotal() { let s = 0; for (let i = 0; i < NLEVELS.length; i++) s += this.nStars(i); return s; },
  happy(type) { const p = this.data.pets[type]; if (!p) return 50; const hours = Math.max(0, (Date.now() - p.t) / 36e5); return clamp(p.h - hours * 3, 0, 100); },
  setHappy(type, h) { this.data.pets[type] = { h: clamp(h, 0, 100), t: Date.now() }; },
  unlockedCount() { let n = 1; for (let i = 0; i < LEVELS.length; i++) if (this.stars(i) > 0) n = Math.max(n, i + 2); return Math.min(n, LEVELS.length); },
  totalStars() { let s = 0; for (let i = 0; i < LEVELS.length; i++) s += this.stars(i); return s; },
  todayKey(offset = 0) { const d = new Date(); d.setDate(d.getDate() + offset); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; },
  dailyStars() { return (this.data.daily.done || {})[this.todayKey()] || 0; },
  dailyStreak() { const d = this.data.daily; if (!d.last) return 0; return (d.last === this.todayKey() || d.last === this.todayKey(-1)) ? d.streak : 0; },
  setDaily(stars) { const d = this.data.daily; const today = this.todayKey(); if (!d.done[today]) { d.streak = d.last === this.todayKey(-1) ? (d.streak || 0) + 1 : 1; d.last = today; } const prevD = d.done[today] || 0; if (stars > prevD) this.data.treats = (this.data.treats || 0) + (stars - prevD); d.done[today] = Math.max(prevD, stars); this.save(); }
};

// ---------------------------------------------------------------- input
const Input = {
  active: null,
  init() {
    const cv = Board.cv;
    cv.addEventListener('pointerdown', e => this.down(e), { passive: false });
    cv.addEventListener('pointermove', e => this.move(e), { passive: false });
    cv.addEventListener('pointerup', e => this.up(e));
    cv.addEventListener('pointercancel', e => this.up(e));
    cv.addEventListener('lostpointercapture', e => { if (this.active === e.pointerId) this.up(e); });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    // belt and braces: block scrolling / zoom gestures on the board
    cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    window.addEventListener('blur', () => { if (this.active !== null) { this.active = null; Game.cancelStroke(); } });
  },
  cell(e) { const r = Board.cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; return Board.cellAt(x, y); },
  down(e) {
    if (this.active !== null || !UI.isScreen('game') || UI.overlayOpen) return;
    e.preventDefault(); Audio.init(); Audio.resume();
    const c = this.cell(e); if (!c) return;
    if (Game.beginStroke(c[0], c[1])) { this.active = e.pointerId; try { Board.cv.setPointerCapture(e.pointerId); } catch (err) {} }
  },
  move(e) {
    if (this.active !== e.pointerId) return; e.preventDefault();
    const r = Board.cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
    const c = Board.cellAt(x, y, true); if (!c) return;

  },

};
